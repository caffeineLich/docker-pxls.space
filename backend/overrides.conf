# >>> OVERRIDES (добавляется автоматически при каждом старте контейнера, не редактируйте ниже этой строки)
# Всегда 1 секунда, без зависимости от числа игроков онлайн
cooldownType: static
staticCooldown {
  time: 1s
}
# Перекрашивание уже закрашенных пикселей не медленнее, чем пустых
backgroundPixel {
  enabled: false
}
# Максимум 20 пикселей: 1 основной + 19 накопленных
stacking {
  cooldownMultiplier: 1
  maxStacked: 19
}
