---
services:
  pxls-backend:
    build:
      dockerfile: Dockerfile
      context: ./backend
    restart: always
    environment:
      DATABASE_USER: "pxls"
      DATABASE_PASSWORD: "ChAnGeMeAtYoUrEaRlIeStCoNvEnIeNcE"
      DATABASE_NAME: "pxls"
      DATABASE_HOST: "pxls-database"
      PXLS_HOST: "localhost"
    volumes:
      - pxls-backend:/data

  pxls-frontend:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    restart: always
    ports:
      - "3009:3000"

  pxls-database:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: "pxls"
      POSTGRES_PASSWORD: "ChAnGeMeAtYoUrEaRlIeStCoNvEnIeNcE"
      POSTGRES_DB: "pxls"
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - pxls-database:/var/lib/postgresql

volumes:
  pxls-database: {}
  pxls-backend: {}
